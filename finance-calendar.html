<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Финансовый календарь проектов</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #1e3a5f;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
    .nav-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.28); }
    .month-label {
      font-size: 20px;
      font-weight: 700;
      min-width: 200px;
      text-align: center;
    }

    /* ── Summary bar ── */
    .summary {
      display: flex;
      gap: 16px;
      padding: 12px 24px;
      background: white;
      border-bottom: 1px solid #e0e4ea;
    }
    .summary-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .summary-item .dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .dot-income { background: #27ae60; }
    .dot-expense { background: #e74c3c; }
    .summary-item strong { font-size: 15px; }
    .summary-sep { flex: 1; }

    /* ── Add button ── */
    .add-btn {
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .add-btn:hover { background: #2c5282; }

    /* ── Weekday labels ── */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 12px 24px 4px;
    }
    .weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #8a9ab5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 0;
    }

    /* ── Calendar grid ── */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 0 24px 24px;
    }
    .cell {
      background: white;
      border-radius: 10px;
      min-height: 110px;
      padding: 8px;
      border: 1px solid #e8ecf2;
      transition: box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .cell:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .cell.empty { background: transparent; border-color: transparent; }
    .cell.today { border-color: #1e3a5f; border-width: 2px; }
    .cell.weekend { background: #f8f9fc; }

    .cell-date {
      font-size: 12px;
      font-weight: 700;
      color: #8a9ab5;
      margin-bottom: 6px;
    }
    .cell.today .cell-date {
      color: white;
      background: #1e3a5f;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      margin-bottom: 6px;
    }

    /* ── Project chips ── */
    .chip {
      border-radius: 6px;
      padding: 4px 6px;
      margin-bottom: 4px;
      font-size: 10px;
      line-height: 1.3;
      word-break: break-word;
    }
    .chip-name {
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip-amounts {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .amount-in {
      color: #1a7a3f;
      font-weight: 600;
    }
    .amount-out {
      color: #c0392b;
      font-weight: 600;
    }
    .chip-bg-1 { background: #eaf6ff; border-left: 3px solid #3498db; }
    .chip-bg-2 { background: #fff5e6; border-left: 3px solid #e67e22; }
    .chip-bg-3 { background: #eafaf1; border-left: 3px solid #27ae60; }
    .chip-bg-4 { background: #fdf2f8; border-left: 3px solid #9b59b6; }
    .chip-bg-5 { background: #fef9e7; border-left: 3px solid #f1c40f; }

    .cell-totals {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid #e8ecf2;
      display: flex;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
    }

    .cell-add {
      position: absolute;
      bottom: 5px; right: 5px;
      width: 18px; height: 18px;
      background: #e8ecf2;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      color: #8a9ab5;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s;
    }
    .cell:hover .cell-add { display: flex; }
    .cell-add:hover { background: #1e3a5f; color: white; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 14px;
      width: 380px;
      max-width: 95vw;
      padding: 28px 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1e3a5f;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5a6a85;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .field input, .field select {
      width: 100%;
      border: 1.5px solid #d8dfe8;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: #1e3a5f; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .btn-cancel {
      background: #f0f2f5;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #5a6a85;
    }
    .btn-save {
      background: #1e3a5f;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: white;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #2c5282; }

    /* ── Entries list in modal ── */
    .entry-list { margin-bottom: 16px; }
    .entry-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: #f8f9fc;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .entry-item-info { flex: 1; }
    .entry-item-name { font-weight: 700; }
    .entry-item-amounts { color: #5a6a85; margin-top: 1px; }
    .entry-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #c0392b;
      font-size: 16px;
      padding: 0 4px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .entry-del:hover { opacity: 1; }
  </style>
</head>
<body>

<div class="header">
  <button class="nav-btn" id="prevMonth">&#8592;</button>
  <div>
    <div class="month-label" id="monthLabel"></div>
  </div>
  <button class="nav-btn" id="nextMonth">&#8594;</button>
</div>

<div class="summary">
  <div class="summary-item">
    <span class="dot dot-income"></span>
    <span>Приход за месяц:</span>
    <strong id="totalIncome">0 ₽</strong>
  </div>
  <div class="summary-item">
    <span class="dot dot-expense"></span>
    <span>Расход за месяц:</span>
    <strong id="totalExpense">0 ₽</strong>
  </div>
  <div class="summary-item" id="balanceBlock">
    <span>Баланс:</span>
    <strong id="totalBalance">0 ₽</strong>
  </div>
  <div class="summary-sep"></div>
  <button class="add-btn" id="openAddModal">+ Добавить запись</button>
</div>

<div class="weekdays" id="weekdays"></div>
<div class="calendar" id="calendar"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Добавить запись</h2>
    <div class="entry-list" id="existingEntries"></div>
    <div class="field">
      <label>Проект</label>
      <input type="text" id="fProject" placeholder="Название проекта" />
    </div>
    <div class="field">
      <label>Дата</label>
      <input type="date" id="fDate" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Приход (₽)</label>
        <input type="number" id="fIncome" placeholder="0" min="0" />
      </div>
      <div class="field">
        <label>Расход (₽)</label>
        <input type="number" id="fExpense" placeholder="0" min="0" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="closeModal">Отмена</button>
      <button class="btn-save" id="saveEntry">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'fin_calendar_entries';
  const WEEKDAY_NAMES = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                       'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const CHIP_COLORS = ['chip-bg-1','chip-bg-2','chip-bg-3','chip-bg-4','chip-bg-5'];

  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth(); // 0-based
  let modalTargetDate = null;

  // ── Storage ──
  function loadEntries() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  // ── Format ──
  function fmt(n) {
    if (!n || n === 0) return '';
    return Number(n).toLocaleString('ru-RU') + ' ₽';
  }
  function fmtFull(n) {
    return Number(n || 0).toLocaleString('ru-RU') + ' ₽';
  }

  // ── Project color map ──
  const projectColorMap = {};
  let colorIdx = 0;
  function getProjectColor(name) {
    if (!projectColorMap[name]) {
      projectColorMap[name] = CHIP_COLORS[colorIdx % CHIP_COLORS.length];
      colorIdx++;
    }
    return projectColorMap[name];
  }

  // ── Render ──
  function render() {
    const entries = loadEntries();
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    // Month label
    document.getElementById('monthLabel').textContent =
      `${MONTH_NAMES[currentMonth]} ${currentYear}`;

    // Weekday headers
    const wdEl = document.getElementById('weekdays');
    wdEl.innerHTML = WEEKDAY_NAMES.map(d => `<div class="weekday">${d}</div>`).join('');

    // Days in month, starting weekday
    const firstDay = new Date(currentYear, currentMonth, 1);
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    let startDow = firstDay.getDay(); // 0=Sun
    startDow = startDow === 0 ? 6 : startDow - 1; // convert to Mon=0

    // Monthly totals
    let monthIncome = 0, monthExpense = 0;

    // Group entries by date
    const byDate = {};
    entries.forEach(e => {
      const d = e.date;
      if (!d) return;
      const [y, m] = d.split('-').map(Number);
      if (y === currentYear && m - 1 === currentMonth) {
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(e);
        monthIncome += Number(e.income || 0);
        monthExpense += Number(e.expense || 0);
      }
    });

    // Summary
    document.getElementById('totalIncome').textContent = fmtFull(monthIncome);
    document.getElementById('totalExpense').textContent = fmtFull(monthExpense);
    const balance = monthIncome - monthExpense;
    const balEl = document.getElementById('totalBalance');
    balEl.textContent = fmtFull(Math.abs(balance));
    balEl.style.color = balance >= 0 ? '#27ae60' : '#e74c3c';
    if (balance < 0) balEl.textContent = '−' + balEl.textContent;

    // Calendar
    const cal = document.getElementById('calendar');
    cal.innerHTML = '';

    // Empty leading cells
    for (let i = 0; i < startDow; i++) {
      cal.innerHTML += `<div class="cell empty"></div>`;
    }

    // Day cells
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isToday = dateStr === todayStr;
      const dow = (startDow + day - 1) % 7;
      const isWeekend = dow >= 5;

      const dayEntries = byDate[dateStr] || [];
      let dayIncome = 0, dayExpense = 0;
      dayEntries.forEach(e => {
        dayIncome += Number(e.income || 0);
        dayExpense += Number(e.expense || 0);
      });

      const chipsHtml = dayEntries.map(e => {
        const cls = getProjectColor(e.project);
        const inStr = e.income  ? `<span class="amount-in">+${fmt(e.income)}</span>` : '';
        const outStr = e.expense ? `<span class="amount-out">−${fmt(e.expense)}</span>` : '';
        return `<div class="chip ${cls}">
          <div class="chip-name" title="${e.project}">${e.project}</div>
          <div class="chip-amounts">${inStr}${outStr}</div>
        </div>`;
      }).join('');

      const totalsHtml = (dayEntries.length > 1) ? `
        <div class="cell-totals">
          ${dayIncome  ? `<span class="amount-in">+${fmt(dayIncome)}</span>` : ''}
          ${dayExpense ? `<span class="amount-out">−${fmt(dayExpense)}</span>` : ''}
        </div>` : '';

      const dateHtml = isToday
        ? `<div class="cell-date"><span>${day}</span></div>`
        : `<div class="cell-date">${day}</div>`;

      cal.innerHTML += `
        <div class="cell${isToday ? ' today' : ''}${isWeekend ? ' weekend' : ''}">
          ${dateHtml}
          ${chipsHtml}
          ${totalsHtml}
          <button class="cell-add" data-date="${dateStr}" title="Добавить">+</button>
        </div>`;
    }

    // Fill trailing cells to complete the last week row
    const totalCells = startDow + daysInMonth;
    const remainder = totalCells % 7;
    if (remainder !== 0) {
      for (let i = 0; i < 7 - remainder; i++) {
        cal.innerHTML += `<div class="cell empty"></div>`;
      }
    }

    // Bind cell add buttons
    document.querySelectorAll('.cell-add').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        openModal(btn.dataset.date);
      });
    });
  }

  // ── Modal ──
  function openModal(dateStr) {
    modalTargetDate = dateStr || null;
    const entries = loadEntries();

    // Set date field
    document.getElementById('fDate').value = dateStr || '';
    document.getElementById('fProject').value = '';
    document.getElementById('fIncome').value = '';
    document.getElementById('fExpense').value = '';

    // Show existing entries for this date
    const existingEl = document.getElementById('existingEntries');
    if (dateStr) {
      const dayEntries = entries.filter(e => e.date === dateStr);
      if (dayEntries.length > 0) {
        existingEl.innerHTML = dayEntries.map((e, i) => {
          const idx = entries.indexOf(e);
          return `<div class="entry-item">
            <div class="entry-item-info">
              <div class="entry-item-name">${e.project}</div>
              <div class="entry-item-amounts">
                ${e.income  ? '+' + fmt(e.income)  : ''}
                ${e.income && e.expense ? ' / ' : ''}
                ${e.expense ? '−' + fmt(e.expense) : ''}
              </div>
            </div>
            <button class="entry-del" data-idx="${idx}" title="Удалить">×</button>
          </div>`;
        }).join('');
        document.getElementById('modalTitle').textContent = `${dateStr.split('-').reverse().join('.')} — записи`;
      } else {
        existingEl.innerHTML = '';
        document.getElementById('modalTitle').textContent = `Добавить: ${dateStr.split('-').reverse().join('.')}`;
      }
    } else {
      existingEl.innerHTML = '';
      document.getElementById('modalTitle').textContent = 'Добавить запись';
    }

    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('fProject').focus();

    // Delete handlers
    document.querySelectorAll('.entry-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        const all = loadEntries();
        all.splice(idx, 1);
        saveEntries(all);
        render();
        openModal(modalTargetDate);
      });
    });
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    modalTargetDate = null;
  }

  function saveEntry() {
    const project = document.getElementById('fProject').value.trim();
    const date    = document.getElementById('fDate').value;
    const income  = parseFloat(document.getElementById('fIncome').value) || 0;
    const expense = parseFloat(document.getElementById('fExpense').value) || 0;

    if (!project) { document.getElementById('fProject').focus(); return; }
    if (!date)    { document.getElementById('fDate').focus(); return; }
    if (!income && !expense) {
      document.getElementById('fIncome').focus(); return;
    }

    const entries = loadEntries();
    entries.push({ project, date, income, expense });
    saveEntries(entries);
    render();
    closeModal();
  }

  // ── Events ──
  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    render();
  });
  document.getElementById('openAddModal').addEventListener('click', () => openModal(null));
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('saveEntry').addEventListener('click', saveEntry);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) saveEntry();
  });

  // ── Init ──
  render();
</script>
</body>
</html>
